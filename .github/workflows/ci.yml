# .github/workflows/ci.yml
name: CI & CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21', '25']  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Java 
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Compilation et tests 
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java-version }}

      - name: Publication du rapport JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ matrix.java-version }}
          path: target/site/jacoco/

      - name: Publication de l'artefact JAR (JDK 25)
        if: matrix.java-version == '25'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  release-and-push:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Téléchargement de l'artefact JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées Docker (SemVer)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build et Push de l'image Docker sur GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Création de la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: target/*.jar
          generate_release_notes: true