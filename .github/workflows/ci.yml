# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21', '25']  

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configuration de Java 
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Compilation et tests 
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java-version }}

      - name: Publication du rapport JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ matrix.java-version }}
          path: target/site/jacoco/

      - name: Publication de l'artefact JAR (JDK 25)
        if: matrix.java-version == '25'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar